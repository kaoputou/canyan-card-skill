openapi: 3.1.0
info:
  title: 窄门餐眼·名片 API
  description: >
    管理餐饮行业名片和人脉。查询名片、人脉信息时必须调用对应接口获取实时数据。
    发起名片交换、接受/拒绝请求、创建或编辑名片等写操作，执行前必须先告知用户并确认。
    Token 失效时（code 40301），引导用户回 App 重新生成 Skill Token。
    配额用完时（code 42901），提示用户在 App 内升级会员。
  version: 0.1.0

servers:
  - url: https://fa-dev.kaoputou.com/api/skill

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 在窄门餐眼 App「我的 → 关于我们 → Token 管理」中生成 Skill Token，形如 sk_xxxxxx

  schemas:
    SuccessResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: >
            40301 Token 无效或已失效 |
            40302 自己尚未创建名片 |
            40303 对方尚未创建名片 |
            40401 资源不存在 |
            40901 状态冲突（已有名片 / 请求已处理）|
            40902 名片审核中不可修改 |
            42201 参数错误 |
            42901 配额已用尽 |
            42902 请求过于频繁
        message:
          type: string
        retry_after:
          type: integer
          description: 限流时返回，单位秒

paths:
  /v1/card/me:
    get:
      operationId: get_my_card
      summary: 查看我的名片
      description: 查看当前用户的名片信息和审核状态。用户询问「我的名片」「审核过了吗」时使用。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          card_id:
                            type: string
                          name:
                            type: string
                          title:
                            type: string
                            description: 职位
                          company:
                            type: string
                          phone:
                            type: string
                          email:
                            type: string
                          intro:
                            type: string
                          status:
                            type: string
                            enum: [none, pending, approved, rejected]
                            description: none 未认证 / pending 审核中 / approved 已通过 / rejected 已拒绝

    put:
      operationId: update_card
      summary: 编辑名片
      description: >
        修改自己的名片信息，编辑后重新进入审核。只传需要修改的字段即可。
        名片处于审核中（status=pending）时不可修改，需等审核完成。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 32
                mobile:
                  type: string
                  maxLength: 20
                cover:
                  type: string
                  description: 头像图片 URL
                title:
                  type: string
                  maxLength: 32
                  description: 职位
                company:
                  type: string
                  maxLength: 50
                intro:
                  type: string
                  maxLength: 1024
                email:
                  type: string
                  maxLength: 64
                wechat:
                  type: string
                  maxLength: 64
                address:
                  type: string
                  maxLength: 64
      responses:
        '200':
          description: 成功，名片已提交重新审核
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/card/create:
    post:
      operationId: create_card
      summary: 创建名片
      description: >
        申请创建主名片，提交后进入审核（通常 1 个工作日）。主名片是对外展示和被搜索的唯一名片。
        创建时需通过 target_type 指定身份：品牌方（公司有餐饮门店）、加盟商（加盟餐饮品牌）、
        供应商（为餐饮门店提供食材/耗材/器具/服务）、其他（媒体/商圈招商等）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mobile, cover, title, company, intro]
              properties:
                name:
                  type: string
                  maxLength: 32
                mobile:
                  type: string
                  maxLength: 20
                cover:
                  type: string
                  description: 头像图片 URL
                title:
                  type: string
                  maxLength: 32
                  description: 职位
                company:
                  type: string
                  maxLength: 50
                intro:
                  type: string
                  maxLength: 1024
                email:
                  type: string
                  maxLength: 64
                wechat:
                  type: string
                  maxLength: 64
                address:
                  type: string
                  maxLength: 64
                target_type:
                  type: integer
                  enum: [1, 2, 3, 4]
                  description: 身份类型：1 供应商 / 2 品牌方 / 3 服务商（其他）/ 4 加盟商
                target_slug:
                  type: string
                  description: 关联品牌或供应链的 slug
                target_logo:
                  type: string
                  description: 关联品牌 logo URL
                show_status:
                  type: boolean
                  description: 是否公开展示名片
                view_condition:
                  type: string
                  description: 查看名片的条件
      responses:
        '200':
          description: 申请已提交，等待审核
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /v1/card/search:
    get:
      operationId: search_cards
      summary: 搜索名片
      description: 搜索餐饮行业名片。只返回审核通过的主名片，每个用户最多展示一张主名片。
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
          description: 搜索关键词，如姓名、公司、职位
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          records:
                            type: array
                            items:
                              type: object
                              properties:
                                card_slug:
                                  type: string
                                  description: 名片唯一标识，仅用于发起交换请求，不得向用户展示
                                name:
                                  type: string
                                cover:
                                  type: string
                                  description: 头像图片
                                title:
                                  type: string
                                  description: 职位
                                company:
                                  type: string
                                intro:
                                  type: string
                                  description: 个人简介
                                targetType:
                                  type: string
                                  description: 身份类型
                                targetName:
                                  type: string
                                  description: 关联品牌/机构名称
                                isAuth:
                                  type: boolean
                                  description: 是否已认证
                                isMine:
                                  type: boolean
                                  description: 是否是自己的名片
                                isZmBro:
                                  type: boolean
                                  description: 是否窄门兄弟
                                tagList:
                                  type: array
                                  items:
                                    type: string
                                  description: 标签列表
                                latestVisitDay:
                                  type: string
                                  description: 最近活跃日期
                                sendStatus:
                                  type: integer
                                  description: 0 表示已可查看联系方式（已交换/已收到分享/对方已投递）
                                phone:
                                  type: string
                                  description: >
                                    手机号。自己的名片、对方无查看门槛、或 sendStatus=0 时返回真实值；否则返回空字符串
                                wechat:
                                  type: string
                                  description: 微信号，可见规则同 phone
                          hasNext:
                            type: boolean
                            description: 是否有下一页

  /v1/card/exchange:
    post:
      operationId: exchange_card
      summary: 发起名片交换
      description: >
        向指定名片发起交换请求。
        card_slug 从搜索结果的 card_slug 字段获取。
        配额：已认证品牌方/加盟商/供应商每日 10 次，SVIP 每日 50 次，VIP 每日 1 次，其他用户累计 5 次。
        返回 remaining 表示剩余次数。7 天无回应可再次投递。
        执行前必须先向用户确认。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card_slug]
              properties:
                card_slug:
                  type: string
                  description: 目标名片唯一标识，从搜索结果的 card_slug 字段获取
                reason:
                  type: string
                  maxLength: 256
                  description: 附言，建议填写交换原因
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          request_id:
                            type: string
                          status:
                            type: string
                            example: pending
                          remaining:
                            type: integer
                            description: 剩余可发起次数

  /v1/card/received:
    get:
      operationId: get_received_cards
      summary: 收到的名片请求
      description: 查看别人发给自己的名片交换请求列表。仅返回待处理（pending）记录。
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total:
                            type: integer
                          list:
                            type: array
                            items:
                              type: object
                              properties:
                                request_id:
                                  type: string
                                from_user:
                                  type: object
                                  properties:
                                    card_slug:
                                      type: string
                                      description: 内部标识，不得向用户展示
                                    name:
                                      type: string
                                    title:
                                      type: string
                                    company:
                                      type: string
                                    avatar:
                                      type: string
                                      description: 对方头像图片
                                    phone:
                                      type: string
                                      description: >
                                        对方手机号。收到投递请求时始终返回，无论对方是否公开。
                                    wechat:
                                      type: string
                                      description: 对方微信号，若对方填写则返回
                                    email:
                                      type: string
                                      description: 对方邮箱，若对方填写则返回
                                status:
                                  type: string
                                  enum: [pending, accepted, rejected]
                                reason:
                                  type: string
                                latest_visit_day:
                                  type: string
                                  description: 对方最近活跃日期
                                created_at:
                                  type: string

  /v1/card/delivered:
    get:
      operationId: get_delivered_cards
      summary: 我投递的名片请求
      description: 查看自己发出去的名片交换请求及对方处理结果，含剩余配额 remaining。
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, accepted, rejected]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total:
                            type: integer
                          remaining:
                            type: integer
                            description: 剩余可发起次数
                          list:
                            type: array
                            items:
                              type: object
                              properties:
                                request_id:
                                  type: string
                                to_user:
                                  type: object
                                  properties:
                                    card_slug:
                                      type: string
                                      description: 内部标识，不得向用户展示
                                    name:
                                      type: string
                                    title:
                                      type: string
                                    company:
                                      type: string
                                    avatar:
                                      type: string
                                      description: 对方头像图片
                                    phone:
                                      type: string
                                      description: >
                                        对方手机号。请求已被接受（status=accepted）时始终返回，无论对方是否公开。
                                        status=pending 或 rejected 时为 null。
                                    wechat:
                                      type: string
                                      description: 对方微信号，status=accepted 时若对方填写则返回
                                    email:
                                      type: string
                                      description: 对方邮箱，status=accepted 时若对方填写则返回
                                status:
                                  type: string
                                  enum: [pending, accepted, rejected]
                                created_at:
                                  type: string

  /v1/card/received/{request_id}/respond:
    post:
      operationId: respond_to_request
      summary: 接受或拒绝名片请求
      description: >
        接受或拒绝收到的名片交换请求。
        request_id 从 get_received_cards 结果中获取。
        接受后双方均可查看对方联系方式。
        执行前必须先向用户确认。
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, reject]
                  description: accept 接受 / reject 拒绝
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          request_id:
                            type: string
                          status:
                            type: string
                            enum: [accepted, rejected]

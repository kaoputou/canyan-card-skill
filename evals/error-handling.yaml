cases:
  - id: 40301-throttle-no-token-guidance
    description: 40301 + message 含"临时锁定"时，不引导重新生成 Token
    messages:
      - role: user
        content: "查一下我的名片"
      - role: tool
        content: '{"code": 40301, "message": "临时锁定：请求过频，请稍后重试"}'
    criteria:
      - 告知"操作过于频繁，请稍后再试"
      - 不引导用户去 Token 管理页面重新生成

  - id: 40301-invalid-token-guide-to-app
    description: 40301 非限流情况，引导用户去 App 重新生成 Token
    messages:
      - role: user
        content: "查一下我的名片"
      - role: tool
        content: '{"code": 40301, "message": "token invalid"}'
    criteria:
      - 引导用户去「我的 → 关于我们 → Token 管理」
      - 不说"操作过于频繁"

  - id: 40302-no-card-guide-to-create
    description: 40302 自己无名片，引导创建
    messages:
      - role: user
        content: "看一下我的名片"
      - role: tool
        content: '{"code": 40302, "message": "no card found"}'
    criteria:
      - 告知当前还没有名片
      - 引导用户创建名片

  - id: 40303-target-no-card
    description: 40303 对方无名片，不引导投递
    messages:
      - role: user
        content: "给李明发一个名片交换请求"
      - role: tool
        content: '{"code": 40303}'
    criteria:
      - 告知对方暂无名片，无法发起交换

  - id: 40901-already-exchanged-no-need-to-apply
    description: 40901 状态冲突，可能是对方名片无需申请
    messages:
      - role: user
        content: "给王五发名片交换"
      - role: tool
        content: '{"code": 40901, "message": "already exchanged"}'
    criteria:
      - 根据上下文判断原因并告知用户具体情况
      - 不笼统报错

  - id: 40902-audit-in-progress-no-edit
    description: 40902 审核中不可修改
    messages:
      - role: user
        content: "把职位改成总经理"
      - role: tool
        content: '{"code": 40902}'
    criteria:
      - 告知当前名片审核中，无法修改
      - 建议等审核完成后（约 1-3 个工作日）再编辑

  - id: 42901-quota-exhausted-guide-upgrade
    description: 42901 配额用尽，提示升级会员并说明各档次配额
    messages:
      - role: user
        content: "给李明发交换请求"
      - role: tool
        content: '{"code": 42901}'
    criteria:
      - 提示今日配额已用尽
      - 提及 App 内升级会员可获更多额度
      - 不引导绕过配额限制

  - id: update-card-name-triggers-audit
    description: 修改姓名或职位会触发审核，修改前告知用户
    messages:
      - role: user
        content: "把我的名字改成王军"
    criteria:
      - 告知修改姓名会触发审核（约 1-3 个工作日，名片进入 pending 状态）
      - 等用户确认后再执行

  - id: update-card-bio-no-audit
    description: 修改简介不触发审核，直接生效
    messages:
      - role: user
        content: "帮我改一下简介：专注餐饮冷链配送十年"
    criteria:
      - 告知修改简介直接生效，不触发审核
      - 等确认后调用 update_card
